<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sabor de Casa - Adicionar Categoria</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header-sistema">
        <div class="logo">Sabor de Casa</div>
        <nav class="nav-links">
            <a href="Index.html">Cardápio</a>
            <a href="Development.html" class="ativo">Gerenciar</a>
        </nav>
    </header>

    <main class="wrapper-centralizado">
        <div class="bloco-formulario">
            
            <div class="cabecalho-form-container">
                <a href="Development.html" class="link-voltar-cat">← Categorias</a>
                <h2 class="titulo-form-cat">Nova categoria</h2>
            </div>

            <div class="card-categoria">
                <div class="card-info" style="width: 100%;">
                    <form onsubmit="cadastrarCategoria(event)">
                        
                        <div class="form-group">
                            <label for="nomeCategoria">Nome da categoria *</label>
                            <input type="text" id="nomeCategoria" required placeholder="Ex: Bebidas">
                        </div>

                        <button type="submit" class="btn-novo">Cadastrar categoria</button>
                    
                    </form>
                </div>
            </div>

        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
