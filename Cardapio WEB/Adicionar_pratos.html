<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sabor de Casa - Adicionar Prato</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header-sistema">
        <div class="logo">Sabor de Casa</div>
        <nav class="nav-links">
            <a href="Index.html">Cardápio</a>
            <a href="Development.html" class="ativo">Gerenciar</a>
        </nav>
    </header>

    <main class="wrapper-centralizado">
        <div class="bloco-formulario" style="max-width: 650px;">
            
            <div class="cabecalho-form-container">
                <a href="Development.html" class="link-voltar-cat">← Voltar para Categorias</a>
                <h2 class="titulo-form-cat" id="tituloCategoriaNome">Novo Prato</h2>
            </div>

            <!-- Box centralizada utilizando a mesma classe .card-categoria -->
            <div class="card-categoria">
                <div class="card-info" style="width: 100%;">
                    <form onsubmit="cadastrarPrato(event)">
                        
                        <!-- Nome do Prato -->
                        <div class="form-group">
                            <label for="nomePrato">Nome do prato *</label>
                            <input type="text" id="nomePrato" required placeholder="Ex: Suco de Laranja Natural">
                        </div>

                        <!-- Descrição -->
                        <div class="form-group">
                            <label for="descricaoPrato">Descrição</label>
                            <input type="text" id="descricaoPrato" placeholder="Ex: Copo de 400ml feito com frutas frescas">
                        </div>

                        <!-- Preço -->
                        <div class="form-group">
                            <label for="precoPrato">Preço (R$) *</label>
                            <input type="text" id="precoPrato" required placeholder="Ex: 8.50">
                        </div>
                        
                        <input type="hidden" id="categoriaIdInput">

                        <button type="submit" class="btn-novo">Cadastrar prato</button>
                    
                    </form>
                </div>
            </div>

        </div>
    </main>
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const categoriaId = urlParams.get('categoria_id'); // Pega o número que veio na URL (ex: ?categoria_id=13)

            if (categoriaId) {
                document.getElementById('categoriaIdInput').value = categoriaId;
            } else {
                alert("Atenção: ID da categoria não encontrado na URL!");
            }
        });
        function cadastrarPrato(event) {
            event.preventDefault();

            const nome = document.getElementById('nomePrato').value;
            const descricao = document.getElementById('descricaoPrato').value;
            const precoStr = document.getElementById('precoPrato').value;
            const id_categoria = document.getElementById('categoriaIdInput').value;

            const preco = parseFloat(precoStr.replace(',', '.'));

            if (isNaN(preco) || preco <= 0) {
                alert("O preço do prato deve ser maior que R$ 0,00.");
                document.getElementById('precoPrato').focus();
                return;
            }

            const dadosPrato = { nome, descricao, preco, id_categoria };

            fetch('http://localhost:3000/pratos', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(dadosPrato)
            })
            .then(async res => {
                const resposta = await res.json();
                
                if (!res.ok) {
                    alert(resposta.erro || "Erro ao cadastrar prato.");
                    return;
                }

                window.location.href = "Development.html?pratoCadastrado=true";
            })
            .catch(err => {
                console.error("Erro na requisição:", err);
                alert("Erro de conexão com o servidor.");
            });
        }
    </script>
</body>
</html>
