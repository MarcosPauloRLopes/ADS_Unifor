<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sabor de Casa - Adicionar Categoria</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header-sistema">
        <div class="logo">Sabor de Casa</div>
        <nav class="nav-links">
            <a href="index.html">Cardápio</a>
            <a href="development.html" class="ativo">Gerenciar</a>
        </nav>
    </header>

    <main class="wrapper-centralizado">
        <div class="bloco-formulario">
            
            <div class="cabecalho-form-container">
                <a href="development.html" class="link-voltar-cat">← Categorias</a>
                <h2 class="titulo-form-cat">Nova categoria</h2>
            </div>

            <div class="card-categoria">
                <div class="card-info" style="width: 100%;">
                    <form onsubmit="cadastrarCategoria(event)">
                        
                        <div class="form-group">
                            <label for="nomeCategoria">Nome da categoria *</label>
                            <input type="text" id="nomeCategoria" required placeholder="Ex: Bebidas">
                        </div>
                        <div class="form-group">
                            <label for="descricaoCategoria">Descrição (opcional)</label>
                            <input type="text" id="descricaoCategoria" placeholder="Ex: Sucos, refrigerantes e águas" maxlength="255">
                        </div>
                        <button type="submit" class="btn-novo">Cadastrar categoria</button>
                    
                    </form>
                </div>
            </div>

        </div>
    </main>

    <script>
        function cadastrarCategoria(event) {
            event.preventDefault();

            const nome_categoria = document.getElementById('nomeCategoria').value;
            const descricao_categoria = document.getElementById('descricaoCategoria').value;

            const dadosCategoria = {
                nome_categoria,
                descricao_categoria
            };

            fetch('https://cardapio-web-production-2d729e78.up.railway.app/categorias', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(dadosCategoria)
            })
            .then(async res => {
                const resposta = await res.json();

                if (!res.ok) {
                    alert(resposta.erro || "Erro ao cadastrar categoria.");
                    return;
                }

                window.location.href = "development.html?adicionarCategoria=true";
            })
            .catch(err => {
                console.error("Erro na requisição:", err);
                alert("Erro de conexão com o servidor.");
            });
        }
    </script>
</body>
</html>
